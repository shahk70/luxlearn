name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.1 && git push --tags
#
# Builds a distributable for each OS and attaches them to a GitHub Release.
# The update checker (inlined in app/app.js) polls this repo's "latest
# release" endpoint, so tagging a release here is what makes the in-app
# update banner show up for users.

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build distributable
        # --publish never: electron-builder must NOT try to create the GitHub
        # Release itself (its GITHUB_TOKEN lacks release rights); the `release`
        # job below creates it via softprops/action-gh-release instead.
        # shell: bash — the default pwsh on windows-latest can't parse the
        # `code=$?` capture below.
        shell: bash
        run: npm run ${{ matrix.script }} -- --publish never > build-output.log 2>&1; code=$?; tail -60 build-output.log; exit $code

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-build-log
          path: build-output.log

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -maxdepth 1 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.blockmap" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-build
          path: release-assets/*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          generate_release_notes: true
